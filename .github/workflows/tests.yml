name: Tests

# Runs on every push and pull request, so a change that breaks household
# isolation or auth is caught before it can reach the phones.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Must match the version used locally. Node 20 is past end-of-life
          # and its test runner cannot expand the glob in the "test" script,
          # which made CI fail while the same command passed on a dev machine.
          node-version: '22'

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        env:
          # The suite refuses to start unless this resolves to a -dev/-test
          # database, so pointing it at production cannot silently happen.
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: npm test

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: mobile
        # Not "npm ci": the Expo dependency tree has peer conflicts that the
        # Expo CLI resolves for us during install, and a plain ci run trips
        # over them.
        run: npm install --legacy-peer-deps

      # Runs before the tests because it is the cheaper signal and catches a
      # whole class the tests cannot: a name used without being imported
      # compiles and bundles fine, then crashes the screen that uses it.
      - name: Lint
        working-directory: mobile
        run: npm run lint

      - name: Run tests
        working-directory: mobile
        # No database and no secrets — these are pure unit tests over
        # formatting, search, translations, the offline cache and the
        # optimistic merge.
        run: npm test
